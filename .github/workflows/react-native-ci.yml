name: React Native CI/CD

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      appRef:
        type: string
        description: 'Velvet source commit or branch to build'
        default: main
      buildType:
        type: choice
        description: 'Build type to run'
        options:
          - ios
          - android
          - all

permissions:
  contents: write
  actions: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
  EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
  EXPO_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}
  NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096

jobs:
  check-skip:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Skip CI check
        run: echo "Proceeding with workflow"

  # Quality Checks
  quality-checks:
    needs: check-skip
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: private
    steps:
      - name: Checkout PRIVATE repo code
        uses: actions/checkout@v4
        with:
          repository: aakarshsasi/velvet
          ref: ${{ inputs.appRef || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: private/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify project structure
        run: |
          echo "Checking project structure..."
          echo "App directory contents:"
          ls -la app/
          echo "Src directory contents:"
          ls -la src/
          echo "Package.json main entry:"
          cat package.json | grep '"main"'

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npx expo lint --max-warnings 100

      - name: Prettier format check
        run: npx prettier --check "**/*.{js,jsx,ts,tsx,json,md}" || echo "Prettier formatting issues found - continuing build"

      - name: Test bundling (Quality Check)
        run: |
          echo "Testing bundling in quality checks..."
          npx expo export --platform ios --output-dir ./quality-test-bundle || {
            echo "Bundling failed in quality checks - this indicates a code issue"
            exit 1
          }
          echo "Bundling test passed in quality checks!"

  # iOS Build (Local - No EAS Minutes Used)
  ios-build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.0.app/Contents/Developer
      EXPO_APPLE_TEAM_ID: D4N62PJYTF
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
    needs: quality-checks
    defaults:
      run:
        working-directory: private
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.buildType == 'ios' || github.event.inputs.buildType == 'all'))
    steps:
      - name: Checkout PRIVATE repo code
        uses: actions/checkout@v4
        with:
          repository: aakarshsasi/velvet
          ref: ${{ inputs.appRef || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private

      - name: Verify Duo-capable Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 27.1$'
          git rev-parse HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: private/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli@23.2.0

      - name: Clear EAS Build Cache
        run: |
          echo "Clearing EAS build cache..."
          rm -rf ~/.eas-build-local || true
          rm -rf ~/.expo || true
          eas build:clear-cache || true
          echo "EAS cache cleared"

      - name: Login to EAS
        run: |
          echo "EXPO_TOKEN is set: $([[ -n "$EXPO_TOKEN" ]] && echo "yes" || echo "no")"
          eas whoami || (echo "❌ EAS login failed! Check EXPO_TOKEN secret" && exit 1)
          echo "✅ EAS login successful"

      - name: Setup iOS build environment
        run: |
          xcode-select -p || xcode-select --install || true
          sudo gem install cocoapods
          echo "✅ iOS build environment ready"

      - name: Setup RevenueCat .env
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: |
          set +x
          if [ -z "$REVENUECAT_API_KEY" ]; then
            echo "❌ ERROR: REVENUECAT_API_KEY secret is not set in GitHub!"
            exit 1
          fi
          echo "::add-mask::$REVENUECAT_API_KEY"
          printf 'REVENUECAT_API_KEY=%s\n' "$REVENUECAT_API_KEY" > .env
          echo "✅ Created .env file"

      - name: Configure Firebase iOS plist
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "❌ ERROR: IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is not set in GitHub!"
            exit 1
          fi

          echo "📄 Decoding GoogleService-Info.plist from secret..."
          mkdir -p ios/velvet
          echo "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/velvet/GoogleService-Info.plist
          plutil -lint ios/velvet/GoogleService-Info.plist
          echo "✅ GoogleService-Info.plist written to ios/velvet/"

      - name: Build iOS Production
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          echo "Starting iOS build..."
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "EAS CLI version: $(eas --version)"
          echo "Current directory: $(pwd)"
          echo "Files in current directory: $(ls -la)"
          echo "Checking app.json build number:"
          cat app.json | grep -A 5 -B 5 "buildNumber"

          if [ ! -f .env ] || ! grep -q '^REVENUECAT_API_KEY=.' .env; then
            echo "❌ .env missing or REVENUECAT_API_KEY not set in .env"
            exit 1
          fi
          if [ -z "$REVENUECAT_API_KEY" ]; then
            echo "❌ REVENUECAT_API_KEY environment variable NOT SET"
            exit 1
          fi
          echo "✅ .env and REVENUECAT_API_KEY are present"

          echo "Testing bundling..."
          npx expo export --platform ios --output-dir ./test-bundle || {
            echo "Bundling test failed"
            exit 1
          }
          echo "Bundling test passed!"

          BUILD_NUMBER=$(jq -r '.expo.ios.buildNumber' app.json)
          if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" = "null" ]; then
            echo "⚠️ Build number not found in app.json, using fallback"
            BUILD_NUMBER=$(cat app.json | grep -o '"buildNumber": "[^"]*"' | cut -d'"' -f4 || echo "1")
          fi
          echo "Building with build number: $BUILD_NUMBER"

          eas build --platform ios --profile production --local --non-interactive --output=./app-ios-build-${BUILD_NUMBER}.ipa || {
            echo "EAS build failed - check the logs above for details"
            exit 1
          }
          echo "iOS build completed successfully!"
          echo "Verifying build number in generated IPA:"
          echo "IPA file size: $(ls -lh ./app-ios-build-${BUILD_NUMBER}.ipa)"
        env:
          NODE_ENV: production
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Submit to App Store (TestFlight)
        id: testflight_submit
        # Failure is recorded here and enforced in the last step, so the GitHub Release
        # upload still runs for a successfully built IPA.
        continue-on-error: true
        run: |
          BUILD_NUMBER=$(jq -r '.expo.ios.buildNumber' app.json || echo "1")
          IPA_FILE="./app-ios-build-${BUILD_NUMBER}.ipa"
          echo "Attempting TestFlight submission of build $BUILD_NUMBER..."
          echo "IPA file: $IPA_FILE"
          eas submit -p ios --path "$IPA_FILE" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload iOS build to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          BUILD_NUMBER=$(jq -r '.expo.ios.buildNumber' app.json || echo "1")
          IPA_FILE="./app-ios-build-${BUILD_NUMBER}.ipa"
          echo "Uploading build $BUILD_NUMBER to GitHub Releases..."

          TAG_NAME="v${{ github.run_number }}"
          RELEASE_TITLE="Release v${{ github.run_number }}"

          if gh release view "$TAG_NAME" --repo "aakarshsasi/velvet" &>/dev/null; then
            echo "⚠️ Release $TAG_NAME already exists. Deleting it..."
            gh release delete "$TAG_NAME" --repo "aakarshsasi/velvet" --yes || echo "Failed to delete release"
            echo "⚠️ Deleting git tag $TAG_NAME..."
            git tag -d "$TAG_NAME" 2>/dev/null || true
            git push origin :refs/tags/"$TAG_NAME" 2>/dev/null || true
          fi

          gh release create "$TAG_NAME" \
            --repo "aakarshsasi/velvet" \
            --title "$RELEASE_TITLE" \
            --notes "## Velvet App Build v${{ github.run_number }}

            ### Changes
            - Automated build from CI repo
            - Built from private repo commit ${{ github.sha }}
            - iOS Build Number: $BUILD_NUMBER

            ### Downloads
            - **iOS**: app-ios-build-${BUILD_NUMBER}.ipa" \
            "$IPA_FILE"

      - name: Fail job if TestFlight submission failed
        if: steps.testflight_submit.outcome == 'failure'
        run: |
          echo "❌ TestFlight submission failed - check status.expo.dev. The IPA was still attached to the GitHub Release."
          exit 1

  # Android Build (Local - No EAS Minutes Used)
  android-build:
    runs-on: ubuntu-latest
    needs: quality-checks
    defaults:
      run:
        working-directory: private
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.buildType == 'android' || github.event.inputs.buildType == 'all'))
    steps:
      - name: Checkout PRIVATE repo code
        uses: actions/checkout@v4
        with:
          repository: aakarshsasi/velvet
          ref: ${{ inputs.appRef || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: private/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Login to EAS
        run: |
          echo "EXPO_TOKEN is set: $([[ -n "$EXPO_TOKEN" ]] && echo "yes" || echo "no")"
          eas whoami || (echo "❌ EAS login failed! Check EXPO_TOKEN secret" && exit 1)
          echo "✅ EAS login successful"

      - name: Setup Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android environment
        run: |
          echo "Setting up Android build environment..."
          echo "ANDROID_HOME=/opt/android" >> $GITHUB_ENV
          echo "PATH=$PATH:/opt/android/cmdline-tools/latest/bin:/opt/android/platform-tools" >> $GITHUB_ENV
          echo "✅ Android environment configured"

      - name: Setup RevenueCat .env
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: |
          set +x
          if [ -z "$REVENUECAT_API_KEY" ]; then
            echo "❌ ERROR: REVENUECAT_API_KEY secret is not set!"
            exit 1
          fi
          echo "::add-mask::$REVENUECAT_API_KEY"
          printf 'REVENUECAT_API_KEY=%s\n' "$REVENUECAT_API_KEY" > .env
          echo "✅ .env created"

      - name: Verify google-services.json
        run: |
          if [ ! -f "google-services.json" ]; then
            echo "❌ ERROR: google-services.json not found!"
            exit 1
          fi
          echo "✅ google-services.json found"
          jq -r '.project_id' google-services.json

      - name: Build Android APK
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          echo "Starting Android build..."
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Java version: $(java -version 2>&1 | head -1)"

          VERSION_CODE=$(jq -r '.expo.android.versionCode' app.json)
          if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" = "null" ]; then
            VERSION_CODE="1"
          fi
          echo "Building with versionCode: $VERSION_CODE"

          echo "Testing bundling..."
          npx expo export --platform android --output-dir ./test-bundle-android || {
            echo "Bundling test failed"
            exit 1
          }
          echo "Bundling test passed!"

          echo "Building APK with EAS..."
          eas build --platform android --profile production --local --non-interactive --output=./app-android-build-${VERSION_CODE}.apk || {
            echo "EAS build failed"
            exit 1
          }
          echo "✅ Android APK build completed!"
          echo "APK file size: $(ls -lh ./app-android-build-${VERSION_CODE}.apk)"
        env:
          NODE_ENV: production
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Upload Android APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          VERSION_CODE=$(jq -r '.expo.android.versionCode' app.json || echo "1")
          APK_FILE="./app-android-build-${VERSION_CODE}.apk"

          echo "Uploading Android APK to GitHub Releases..."

          TAG_NAME="v${{ github.run_number }}"
          RELEASE_TITLE="Release v${{ github.run_number }}"

          # Check if release exists and update it
          if gh release view "$TAG_NAME" --repo "aakarshsasi/velvet" &>/dev/null; then
            echo "📦 Release $TAG_NAME exists. Uploading APK..."
            gh release upload "$TAG_NAME" "$APK_FILE" --repo "aakarshsasi/velvet" --clobber
          else
            echo "Creating new release..."
            gh release create "$TAG_NAME" \
              --repo "aakarshsasi/velvet" \
              --title "$RELEASE_TITLE" \
              --notes "## Velvet App Build v${{ github.run_number }}

              ### Changes
              - Automated build from CI repo
              - Built from private repo commit ${{ github.sha }}
              - Android versionCode: $VERSION_CODE

              ### Downloads
              - **Android**: app-android-build-${VERSION_CODE}.apk" \
              "$APK_FILE"
          fi
